name: Windows portable build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Chinese portable release
        shell: pwsh
        run: ./build.ps1
      - name: Activation, shortcut, archive and pagination regression checks
        shell: pwsh
        run: dotnet run --project tests/WinTendedero.Tests -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: win-tendedero-windows-x64
          path: |
            artifacts/win-tendedero-v*-windows-x64.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
